<section class="login" [formGroup]="loginForm">
    <div class="container">
        <div class="form">
            <div class="form-title">
                Войти в личный кабинет
            </div>
            <div class="form-inputs">
                <div class="form-input">
                    <input type="text" class="input" placeholder="Электронная почта" formControlName="email" [ngStyle]="{'border-color': loginForm.get('email')?.invalid && 
                        (loginForm.get('email')?.dirty || loginForm.get('email')?.touched) ? 'red' : ''}">
                    <div class="error-message"
                        *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)">
                        <div class="text-danger" *ngIf="loginForm.get('email')?.errors?.['required']">
                            Поле Электронная почта обязательно.
                        </div>
                        <div class="text-danger" *ngIf="loginForm.get('email')?.errors?.['email']">
                            Электронная почта не корректна.
                        </div>
                    </div>
                </div>
                <div class="form-input">
                    <input type="password" class="input" placeholder="Пароль" formControlName="password" [ngStyle]="{'border-color': loginForm.get('password')?.invalid && 
                        (loginForm.get('password')?.dirty || loginForm.get('password')?.touched) ? 'red' : ''}">
                    <div class="error-message"
                        *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)">
                        <div class="text-danger" *ngIf="loginForm.get('password')?.errors?.['required']">
                            Поле Пароль обязательно.
                        </div>
                        <div class="text-danger" *ngIf="loginForm.get('password')?.errors?.['pattern']">
                            Пароль не надежен.
                        </div>
                    </div>
                </div>
                <div class="form-checkbox">
                    <input type="checkbox" id="remember" formControlName="agree">
                    <label for="remember">Запомнить меня</label>
                </div>
            </div>
            <div class="form-button">
                <button class="button" [disabled]="loginForm.invalid" (click)="login()">Войти</button>
            </div>
            <div class="form-link">
                Нет аккаунта? <a routerLink="/signup">Пройдите регистрацию</a>
            </div>
        </div>
        <div class="page-image">
            <img src="/assets/images/pages/login-image.png" alt="woman">
        </div>
    </div>
</section>
